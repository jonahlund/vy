[package]
name = "vy"
version = "0.3.0"
edition = "2024"
authors = ["Jonah Lund <jonahlund@tuta.io>"]
description = "Write HTML with simple macros"
repository = "https://github.com/JonahLund/vy"
license = "MIT"

[workspace]
resolver = "2"
members = ["core", "macros"]

[features]
default = ["std"]
std = ["vy-core/std"]
nightly = ["vy-core/nightly"]

[dependencies]
vy-core = { path = "./core", version = "0.3.0" }
vy-macros = { path = "./macros", version = "0.3.0" }
